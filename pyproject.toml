[project]
name = "holograma-unev"
version = "0.1.0"
description = "Asistente holográfico de la UNEV (backend Python + interfaz React/Tauri)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Permite importar los módulos del backend (provider_config, llm_backend, ...)
# sin instalar el proyecto como paquete.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["frontend", "graphify-out", "piper", ".venv", "static"]

[tool.ruff.lint]
# Reglas pragmáticas para un backend de prototipo que pasa a producción.
select = ["E", "F", "W", "I", "UP", "B"]
# E501 (longitud) la cubre el formateador; BLE001 lo permitimos puntualmente con noqa.
ignore = ["E501"]
