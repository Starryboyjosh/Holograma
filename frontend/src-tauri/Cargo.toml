[package]
name = "holograma"
version = "0.1.0"
description = "Holograma UNEV — desktop shell que arranca el backend FastAPI y muestra la UI React"
authors = ["UNEV"]
edition = "2021"

# El binario desktop reutiliza la lógica de `run()` definida en la librería.
[lib]
name = "holograma_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Recuerda posición/tamaño de las ventanas entre ejecuciones (monitores verticales).
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
